# Alertmanager — routage des alertes Prometheus.
#
# Stratégie :
#   critical → notification immédiate Telegram (group_wait court, repeat 1h)
#   warning  → notification Telegram groupée (5 min, repeat 4h)
#
# Pipeline :
#   Prometheus → POST /api/v2/alerts → Alertmanager
#              → match route → POST webhook → alertmanager-bot:8080
#              → Telegram API → opérateur(s) enregistrés via /start
#
# Setup requis (cf ops/README.md § Telegram setup) :
#   1. ops/.env contient TELEGRAM_TOKEN et TELEGRAM_ADMIN
#   2. Bot Telegram créé via @BotFather
#   3. L'opérateur a envoyé /start au bot
#
# Sans setup Telegram : les alertes restent visibles dans UI :9093, l'historique
# reste interrogeable via /api/v2/alerts — le système n'est jamais aveugle,
# juste muet côté push notification.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-critical
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 1h
      continue: true
    - matchers:
        - severity = "warning"
      receiver: telegram-warning
      continue: true

inhibit_rules:
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [severity="warning"]
    equal: ["service"]

receivers:
  - name: default
    # Pas de notification externe — fallback silencieux. Les alertes restent
    # visibles dans UI :9093 et interrogeables via /api/v2/alerts.

  - name: telegram-critical
    webhook_configs:
      - url: "http://alertmanager-bot:8080"
        send_resolved: true
        max_alerts: 0

  - name: telegram-warning
    webhook_configs:
      - url: "http://alertmanager-bot:8080"
        send_resolved: true
        max_alerts: 0
