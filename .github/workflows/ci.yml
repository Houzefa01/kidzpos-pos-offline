name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + tsc + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    # Docker est natif sur ubuntu-latest → TestContainers fonctionne sans configuration.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - name: Compile
        working-directory: backend
        run: mvn -B -q compile test-compile
      - name: Tests (TestContainers Postgres)
        working-directory: backend
        run: mvn -B verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
