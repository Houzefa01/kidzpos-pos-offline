name: Release

# T13 — Build artefact JAR + image Docker à chaque tag vX.Y.Z (semver).
# Le workflow ci.yml reste responsable des tests + lint sur PRs/main ;
# release.yml ne tourne QUE sur tag, après que ci.yml a validé l'arbre.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write          # créer la GitHub Release + uploader les assets
  packages: write          # push vers GHCR

jobs:
  build-jar:
    name: Build JAR + frontend dist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── Backend ────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build JAR (skip tests — déjà validés par ci.yml)
        working-directory: backend
        run: mvn -B -q package -DskipTests

      - name: Stamp version in JAR filename
        run: |
          cp backend/target/kidzpos-backend-*.jar kidzpos-backend-${{ steps.meta.outputs.version }}.jar
          sha256sum kidzpos-backend-${{ steps.meta.outputs.version }}.jar \
            > kidzpos-backend-${{ steps.meta.outputs.version }}.jar.sha256

      # ── Frontend (3 variants: standalone, central, store) ──────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build dist standalone
        run: |
          npm run build
          tar -czf kidzpos-frontend-standalone-${{ steps.meta.outputs.version }}.tar.gz dist/

      - name: Verify shell scripts syntax
        run: |
          for s in ops/backup/*.sh ops/scripts/*.sh ops/test-env/*.sh start-server.sh; do
            [ -f "$s" ] && bash -n "$s"
          done

      # ── Upload tous les artefacts dans la release ──────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kidzpos-backend-${{ steps.meta.outputs.version }}.jar
            kidzpos-backend-${{ steps.meta.outputs.version }}.jar.sha256
            kidzpos-frontend-standalone-${{ steps.meta.outputs.version }}.tar.gz

  build-image:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR for image
        working-directory: backend
        run: |
          # On rebuild ici plutôt que de réutiliser l'artefact du job précédent
          # (les jobs ne partagent pas de filesystem ; un upload/download
          # artifact ajouterait 2 min pour ~50 Mo, le rebuild prend 1 min).
          mvn -B -q package -DskipTests
          cp target/kidzpos-backend-*.jar app.jar

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ needs.build-jar.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-jar.outputs.version }}
